[project]
name = "tidewatch"
version = "0.1.0"
description = "Read-only CLI that scans a Kubernetes app, diagnoses common failures and writes a ticket-ready report."
requires-python = ">=3.12"
dependencies = [
    "kubernetes>=37.0.1",
    "pydantic>=2.14.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
tidewatch = "tidewatch.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

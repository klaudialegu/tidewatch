# Lab scenario: one change on top of the healthy base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k8s
patches:
  - target:
      kind: Deployment
      name: agent
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/env/0/name
        value: API_KEY
      - op: remove
        path: /spec/template/spec/containers/0/env/0

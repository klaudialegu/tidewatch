# Lab scenario: one change on top of the healthy base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k8s
patches:
  - target:
      kind: Deployment
      name: agent
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MEMORY_HOG
          value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 64Mi

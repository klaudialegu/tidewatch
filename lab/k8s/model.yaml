# The lab's fake LLM provider (tidewatch_agent.model_api, same image as the agent). In-cluster only.
# MODEL_MODE is the lever the llm-* scenarios change; it must stay the first env entry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model
  namespace: demo
  labels:
    app: model
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: model
  template:
    metadata:
      labels:
        app: model
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: model
          image: tidewatch-agent:0.2.0
          imagePullPolicy: IfNotPresent
          command: ["/app/.venv/bin/tidewatch-model"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MODEL_MODE
              value: ok
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 250m
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: model
  namespace: demo
spec:
  type: ClusterIP
  selector:
    app: model
  ports:
    - name: http
      port: 80
      targetPort: http
